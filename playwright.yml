name:Playwright Tests
on:
   push:
     branches:[main,master]
   pull:
     branches:[main,master]
   jobs:
     test:
       timeout-minutes:60
       runs-on:ubuntu-latest
       steps:
       -uses: actions/checkout@v4
       -uses:actions/setup-node@v4
       with:
       node-version:20
       -name:Install dependencies
       run:npm ci
   
